# 此开源项目地址 https://github.com/lowlighter/metrics

name: GitHub Metrics

on:
  schedule:
    # Daily at 08:40 in Asia/Shanghai.
    - cron: "40 0 * * *"
    # https://docs.github.com/zh/actions/using-workflows/events-that-trigger-workflows#schedule
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/github-metrics/**"
      - "docs/assets/github-contribution-grid-snake.*"
  
concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Check optional credentials
        id: credentials
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "metrics=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WAKATIME_TOKEN" ]; then
            echo "wakatime=true" >> "$GITHUB_OUTPUT"
          fi
      # 基础信息（顺带了几个小插件）
      - name: base
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/base.svg
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: zhangzhiwei-zzw
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"
          # 此插件为文档中的 🧮 Repositories traffic
          plugin_traffic: yes
          # 此插件为文档中的 👨‍💻 Lines of code changed
          plugin_lines: yes
          # 此插件为文档中的 🙋 Introduction
          plugin_introduction: yes
          # 此插件为文档中的 🎫 Gists
          plugin_gists: yes
          # 此插件为文档中的 💫 Star lists
          # plugin_starlists: yes
          # plugin_starlists_limit_repositories: 2
          # plugin_starlists_languages: yes
          # plugin_starlists_limit_languages: 8
          # plugin_starlists_only: Awesome
          
      # 📅 Isometric commit calendar
      - name: Full-year calendar
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # 不添加基础信息
          base: ""
          # 使用此插件
          plugin_isocalendar: yes
          # 设置成显示整年
          plugin_isocalendar_duration: full-year

      # 🈷️ Languages activity
      - name: Indepth analysis
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/languages.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 4
          plugin_languages_analysis_timeout: 15

      # ✨ Stargazers   
      - name: Using chartist charts
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/stargazers.chartist.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

      # 🌟 Recently starred repositories
      - name: Recently starred
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 10
          
      # 💡 Coding habits and activity
      - name: Recent activity charts
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/habits.charts.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          config_timezone: Asia/Shanghai
          
      # 🎟️ Follow-up of issues and pull requests 
      - name: Indepth analysis
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/followup.indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes
          
      # 🎭 Comment reactions
      - name: Comment reactions
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/reactions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_reactions: yes
          plugin_reactions_limit: 100
          plugin_reactions_details: percentage

      # 🧑‍🤝‍🧑 People    
      - name: Followers
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/people.followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          plugin_people_limit: 300
          plugin_people_size: 36
          plugin_people_types: followers, following
          
      # 📓 Featured repositories
      - name: Pinned repositories
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/repositories.pinned.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 2

      # 💬 Discussions
      - name: GitHub Discussions
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/discussions.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_discussions: yes
          plugin_discussions_categories_limit: 8       
   
      # 📆 Commit calendar
      - name: Full history calendar
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      # 🏆 Achievements
      - name: Compact display
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/achievements.compact.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_only: >-
            polyglot, stargazer, sponsor, deployer, member, maintainer, developer,
            scripter, packager, explorer, infographile, manager
          plugin_achievements_display: compact
          plugin_achievements_threshold: X

      # 📰 Recent activity
      - name: Recent activity
        if: steps.credentials.outputs.metrics == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
   
      # ⏰ WakaTime
      - name: WakaTime
        if: steps.credentials.outputs.wakatime == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: docs/github-metrics/wakatime.svg
          token: NOT_NEEDED
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
