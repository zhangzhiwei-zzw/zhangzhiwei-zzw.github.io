name: Generate Snake

on:
  schedule:
    # Daily at 08:20 in Asia/Shanghai.
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            docs/assets/github-contribution-grid-snake.gif
            docs/assets/github-contribution-grid-snake.svg
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: docs/assets/github-contribution-grid-snake.gif docs/assets/github-contribution-grid-snake.svg
          default_author: github_actions
          message: 'Generate Contribution Snake'
