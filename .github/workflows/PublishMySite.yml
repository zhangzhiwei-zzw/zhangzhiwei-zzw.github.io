name: publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [GitHub Metrics, Generate Snake]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize production builds and deployments; PR checks have their own group.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the PR merge commit for checks, and current main for publishing.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: mkdocs build --strict
      - run: python scripts/check_site.py site
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site/
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Publish built site to gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ghp-import -n -p -f site
